name: Deploy

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/kurotyan514/gae265-03-group-project

jobs:
  # 只有已在 main 歷史上、且 main 上的 CI 已成功的 commit 能部署
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: commit 必須在 main 上
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: main 上的 CI 必須已成功
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --event push --commit "$GITHUB_SHA" \
            --json conclusion --jq 'any(.[]; .conclusion == "success")' | grep -qx true \
            || { echo "::error::$GITHUB_SHA 在 main 上的 CI 尚未成功（還在跑或失敗），等綠燈再部署"; exit 1; }

  build:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: deploy-build
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 檢查 image 是否已存在（回滾舊版時不重新打包）
        id: exists
        run: |
          if docker buildx imagetools inspect "$REGISTRY-backend:$GITHUB_SHA" >/dev/null 2>&1 \
            && docker buildx imagetools inspect "$REGISTRY-caddy:$GITHUB_SHA" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v3
        if: steps.exists.outputs.found != 'true'
      - name: 版本號 tag
        id: ver
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"; fi
      - uses: docker/build-push-action@v6
        if: steps.exists.outputs.found != 'true'
        with:
          context: .
          file: backend/Dockerfile
          target: prod
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}-backend:${{ github.sha }}
            ${{ steps.ver.outputs.tag && format('{0}-backend:{1}', env.REGISTRY, steps.ver.outputs.tag) || '' }}
      - uses: docker/build-push-action@v6
        if: steps.exists.outputs.found != 'true'
        with:
          context: .
          file: docker/caddy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}-caddy:${{ github.sha }}
            ${{ steps.ver.outputs.tag && format('{0}-caddy:{1}', env.REGISTRY, steps.ver.outputs.tag) || '' }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    # 正在跑的跑完，排隊的只留最新一個
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: 設定 SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: 部署
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: make deploy DEPLOY_HOST="$DEPLOY_HOST" REF="$GITHUB_SHA"
      - name: 外部健康檢查
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          host="${DEPLOY_HOST#*@}"
          for i in $(seq 1 12); do
            curl -fsS "https://$host/api/v1/health" && exit 0
            sleep 10
          done
          exit 1
