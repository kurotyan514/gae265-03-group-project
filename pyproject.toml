[project]
name = "gae265_03_group_project"
version = "0.1.0"
description = "根據旅行規劃推薦旅遊保險、並依條款回答問題的 SPA"
requires-python = ">=3.14"
dependencies = ["app"]

[tool.uv]
package = false

[tool.uv.sources]
app = { workspace = true }

[tool.uv.workspace]
members = ["backend"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
