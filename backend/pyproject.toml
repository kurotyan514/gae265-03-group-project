[project]
name = "app"
version = "0.1.0"
description = "gae265_03_group_project backend"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "cryptography>=50.0.2",
    "fastapi[standard]",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "langchain>=1.4.7",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.2",
    "langchain-text-splitters>=1.1.3",
    "langchain-typesafe>=0.0.1a3",
    "langgraph>=1.2.17",
    "langgraph-checkpoint-postgres>=3.2.0",
    "mcp>=2.3.0",
    "numpy>=2.5.4",
    "pdfplumber>=0.11.10",
    "pgvector>=0.5.1",
    "psycopg[binary,pool]",
    "pydantic-settings",
    "pymupdf>=2.0",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]",
    "sqlmodel",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
