[project]
name = "app"
version = "0.1.0"
description = "gae265_03_group_project backend"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "fastapi[standard]",
    "psycopg[binary]",
    "pydantic-settings",
    "sqlalchemy[asyncio]",
    "sqlmodel",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
