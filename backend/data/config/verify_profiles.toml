# 內容驗證用的各保險公司 PDF 版面規則（backend/app/ingest/verify）。新公司先用 [default]，跑出來有誤判再為該公司加設定。
# 每條規則都要註明「依據」：在哪份 PDF 的哪一頁親眼看到這種版面。
# 這裡的規則是驗證用的，刻意和切塊程式（ingest/clauses.py）分開寫，避免用同一套邏輯檢查自己。

[default]
# 條文標題行：「第N條」後面接空白與短標題，或單獨一行（標題在下一行）。
# 標題不可含 ，。；： —— 這樣「第三十二條第一款所列文件，」這類內文引用不會被當成標題。
article_heading = '^第\s*(?P<no>[0-9０-９零〇一二三四五六七八九十百]+)\s*條(?:\s+(?P<title>[^，。；：,;]{1,30}))?$'
chapter_heading = '^第\s*(?P<no>[0-9０-９零〇一二三四五六七八九十百]+)\s*章\s*(?P<title>.*)$'
# 章底下的節標題（華南第三章分成第一節旅程取消…）：和章標題一樣不算任何一條的內文
section_heading = '^第\s*(?P<no>[0-9０-９零〇一二三四五六七八九十百]+)\s*節(?:\s+(?P<title>[^，。；：,;]{1,40}))?$'
# 標題單獨一行時，下一行最長幾個字還算標題
max_title_len = 30
# 不屬於條文內容的行：頁碼
drop_lines = ['^\d{1,3}$']
# 附表開始：之後到下一條標題之前的內容不算條文
appendix_start = ['^附表[一二三四五六七八九十0-9]*(?:[：:\s].*)?$', '^附件[一二三四五六七八九十0-9]*(?:[：:\s].*)?$']

# 頁首頁尾的制式文字：整段（可跨行）刪除。預設沒有。
boilerplate = []

# 頁面欄數：多欄排版的 PDF 要設定，pdfplumber 才會先依欄位切開再讀（pymupdf 本來就依欄位順序讀）。
columns = 1

[companies."富邦產物"]
# 依據：T068、T113、TA28、TA38、TA45 第 1 頁頂端的制式聲明、商品文號、申訴電話（看頁面圖片可見，屬於頁首，不是條文）。
# pymupdf 會把這些排在第 1 頁的後面而且順序各份不同，若不刪除會黏到第 1 頁的最後一條條文。
# 每一段各自一條規則，不依賴排列順序。
boilerplate = [
  '「本商品經本公司合格簽署人員.*?依法負責。」',
  '(?:商品文號|備查文號|核准文號)\s*[：:].*?號函備查。',
  '\d{2,3}\.\d{2}\.\d{2}\s*富保業字第\s*\d+\s*號函備查。',
  '查閱本公司資訊公開說明文件.*?查詢。',
  '本公司申訴電話[：:]\s*[0-9-]+',
  '免付費\s*24\s*小時服務[（(]申訴[）)]專線[：:]\s*[0-9-]+',
  # 依據：T147 第 1 頁右上角的紅字提醒（頁首）；只刪「整行就是這句」的情況
  '(?m)^本保險為非保證續保之健康保險$',
]

[companies."華南產物"]
# 依據：huanan.pdf 每頁（例如第 1、2 頁）是左右兩欄排版，條文由左欄讀到右欄。
# pdfplumber 依 y 座標橫跨整頁讀，同高度的左右欄文字會被接成同一行，所以設 2 欄先切開再讀。
columns = 2

[companies."安達產物"]
# 依據：chubb.pdf 是 A4 直式，每頁（例如第 2、3 頁）三欄排版，條文由左欄讀到右欄，所以設 3 欄。
columns = 3
# 依據：第 2 頁 CHUBB04 的標題寫成「第一條【保險契約的構成】」（條與【】之間沒有空白），
# 同頁 CHUBB05 的標題寫成「第一條 保險契約之構成」（有空白）；兩種寫法並存，所以「條」後面允許空白或【。
# 標題內不可含 ，。；：，同 default。
article_heading = '^第\s*(?P<no>[0-9０-９零〇一二三四五六七八九十百]+)\s*條(?=$|\s|【)\s*(?P<title>[^，。；：,;]{1,30})?$'
# 依據：第 2、3 頁最下方（pymupdf 排在頁首）的頁尾行「第2頁，共8頁   2026.04.1_CTI_PolicyWording_…」，不是條文。
drop_lines = ['^\d{1,3}$', '^第\s*\d+\s*頁\s*[，,]\s*共\s*\d+\s*頁\b.*$']
